<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Dance Pad - Arcade Mode</title>
    <style>
        /* Estética Arcade Neon */
        body {
            background-color: #050510;
            color: #fff;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        h1 {
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            font-size: 40px;
            margin-top: 20px;
        }

        /* Menu de Seleção de Música */
        #menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }

        .song-btn {
            background: transparent;
            border: 2px solid #ff00ff;
            color: #ff00ff;
            padding: 15px 40px;
            margin: 10px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            width: 400px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .song-btn:hover {
            background: #ff00ff;
            color: #fff;
            box-shadow: 0 0 20px #ff00ff;
            transform: scale(1.05);
        }

        /* Status do MQTT */
        #status-bar {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 14px;
            color: #666;
        }

        /* Tela de Jogo (Escondida por padrão) */
        #game-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* HUD - Placar e Combo */
        #hud {
            position: absolute;
            top: 20px;
            left: 40px;
            text-align: left;
        }

        .pontos {
            font-size: 32px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            font-weight: 900;
        }

        .combo {
            font-size: 24px;
            color: #ff00ff;
            margin-top: 10px;
            font-style: italic;
        }

        #feedback {
            font-size: 40px;
            font-weight: bold;
            margin-top: 20px;
            position: absolute;
            left: 40px;
            top: 120px;
        }

        /* Pista de Dança Centralizada */
        #game-board {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 440px;
            height: 100vh;
            border-left: 2px solid rgba(255, 255, 255, 0.1);
            border-right: 2px solid rgba(255, 255, 255, 0.1);
            background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(20, 20, 50, 0.8) 100%);
        }

        /* Zonas de Acerto Físicas (Hitboxes) */
        .hitbox-container {
            position: absolute;
            bottom: 50px;
            width: 100%;
            height: 100px;
        }

        .pad {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 3px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.8);
            transition: 0.1s;
        }

        /* Cores Neon para cada direção ao pisar */
        #pad-LEFT.active {
            border-color: #ff0055;
            box-shadow: 0 0 25px #ff0055;
            background: rgba(255, 0, 85, 0.3);
            transform: scale(1.1);
        }

        #pad-UP.active {
            border-color: #00ffcc;
            box-shadow: 0 0 25px #00ffcc;
            background: rgba(0, 255, 204, 0.3);
            transform: scale(1.1);
        }

        #pad-DOWN.active {
            border-color: #00aaff;
            box-shadow: 0 0 25px #00aaff;
            background: rgba(0, 170, 255, 0.3);
            transform: scale(1.1);
        }

        #pad-RIGHT.active {
            border-color: #ffaa00;
            box-shadow: 0 0 25px #ffaa00;
            background: rgba(255, 170, 0, 0.3);
            transform: scale(1.1);
        }

        /* Notas caindo */
        .note {
            position: absolute;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border-radius: 15px;
            border: 2px solid #fff;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 10px #fff;
        }

        #btn-voltar {
            position: absolute;
            top: 20px;
            right: 40px;
            background: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
    <!-- Biblioteca MQTT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"
        type="text/javascript"></script>
</head>

<body>

    <!-- TELA 1: MENU PRINCIPAL -->
    <div id="menu">
        <h1>SELECIONE A FAIXA</h1>
        <div id="lista-musicas">
            <!-- Botões gerados via JS -->
        </div>
    </div>
    <div id="status-bar">MQTT: Conectando...</div>

    <!-- TELA 2: GAMEPLAY -->
    <div id="game-screen">
        <button id="btn-voltar" onclick="voltarAoMenu()">⬅ Voltar ao Menu</button>

        <div id="hud">
            <div class="pontos">SCORE: <span id="score">0</span></div>
            <div class="combo" id="combo-display">Combo: 0x</div>
            <div id="feedback"></div>
        </div>

        <div id="game-board">
            <div class="hitbox-container">
                <div id="pad-LEFT" class="pad" style="left: 20px;">⬅️</div>
                <div id="pad-UP" class="pad" style="left: 120px;">⬆️</div>
                <div id="pad-DOWN" class="pad" style="left: 220px;">⬇️</div>
                <div id="pad-RIGHT" class="pad" style="left: 320px;">➡️</div>
            </div>
        </div>
    </div>

    <!-- Áudio Invisível -->
    <audio id="audio-player"></audio>

    <script>
        // ==========================================
        // 1. CATÁLOGO DE MÚSICAS E BEATMAPS
        // ==========================================
        // Dica: Baixe os mp3 para a mesma pasta do projeto e troque os "src" (ex: "./zelda.mp3")
        const catalogo = [
            {
                id: 0,
                titulo: "Ai se eu te pego",
                src: "Ai Se Eu Te Pego MP3.mp3",
                velocidadeSeta: 2.5,
                beatmap: [
                    { time: 2.0, dir: "UP" }, { time: 2.5, dir: "DOWN" },
                    { time: 4.0, dir: "LEFT" }, { time: 4.5, dir: "RIGHT" },
                    { time: 6.0, dir: "UP" }, { time: 6.5, dir: "UP" }

                ]
            },
            {
                id: 1,
                titulo: "Evidências",
                src: "evidencias.mp3", // Troque para o mp3 real
                velocidadeSeta: 3.5,
                beatmap: [
                    { time: 1.5, dir: "LEFT" }, { time: 3.0, dir: "RIGHT" },
                    { time: 4.5, dir: "UP" }, { time: 6.0, dir: "DOWN" }
                ]
            },
            {
                id: 2,
                titulo: "Pós",
                src: "pos.mp3", // Troque para o mp3 real
                velocidadeSeta: 5.0,
                beatmap: [
                    { time: 1.0, dir: "DOWN" }, { time: 1.5, dir: "UP" },
                    { time: 2.0, dir: "LEFT" }, { time: 2.5, dir: "RIGHT" },
                    { time: 3.0, dir: "DOWN" }, { time: 3.5, dir: "UP" }
                ]
            }
        ];

        // ==========================================
        // 2. LÓGICA DO MENU
        // ==========================================
        const menuDiv = document.getElementById("menu");
        const gameScreen = document.getElementById("game-screen");
        const listaMusicasDiv = document.getElementById("lista-musicas");
        const audioPlayer = document.getElementById("audio-player");

        let musicaAtual = null;
        let jogoRodando = false;

        // Renderiza os botões do menu
        catalogo.forEach((musica, index) => {
            const btn = document.createElement("button");
            btn.className = "song-btn";
            btn.innerText = musica.titulo;
            btn.onclick = () => iniciarPartida(index);
            listaMusicasDiv.appendChild(btn);
        });

        function iniciarPartida(index) {
            musicaAtual = catalogo[index];

            // Reseta variáveis do jogo
            score = 0;
            combo = 0;
            notaAtualIndex = 0;
            atualizarHUD();

            // Limpa setas antigas da tela
            activeNotes.forEach(note => gameBoard.removeChild(note.el));
            activeNotes = [];

            // Troca de tela
            menuDiv.style.display = "none";
            gameScreen.style.display = "block";

            // Prepara e toca a música
            audioPlayer.src = musicaAtual.src;
            audioPlayer.play();

            jogoRodando = true;
            requestAnimationFrame(gameLoop);
            requestAnimationFrame(maestroLoop);
        }

        function voltarAoMenu() {
            jogoRodando = false;
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            gameScreen.style.display = "none";
            menuDiv.style.display = "flex";
        }

        // ==========================================
        // 3. COMUNICAÇÃO MQTT (Fica rodando no fundo)
        // ==========================================
        const broker = "broker.hivemq.com";
        const port = 8884;
        const clientId = "arcade_web_" + Math.random().toString(16).substring(2, 8);
        const topic = "seminario/str/tapete/movimento";
        const client = new Paho.MQTT.Client(broker, port, clientId);

        client.onMessageArrived = (message) => {
            if (!jogoRodando) return; // Só processa pisão se estiver jogando
            const direcao = message.payloadString.trim();
            ativarHitbox(direcao);
            avaliarAcerto(direcao);
        };

        client.connect({
            useSSL: true,
            onSuccess: () => {
                document.getElementById("status-bar").innerText = "MQTT: Conectado e Aguardando Tapete";
                document.getElementById("status-bar").style.color = "#00ffcc";
                client.subscribe(topic);
            }
        });

        // ==========================================
        // 4. MOTOR DO JOGO (RENDER E AVALIAÇÃO)
        // ==========================================
        let score = 0;
        let combo = 0;
        let activeNotes = [];
        let notaAtualIndex = 0;

        const gameBoard = document.getElementById("game-board");
        // As posições batem com o style left das hitboxes
        const columns = { "LEFT": 20, "UP": 120, "DOWN": 220, "RIGHT": 320 };
        const emojis = { "LEFT": "⬅️", "UP": "⬆️", "DOWN": "⬇️", "RIGHT": "➡️" };

        function maestroLoop() {
            if (!jogoRodando) return;
            let tempoAudio = audioPlayer.currentTime;

            if (notaAtualIndex < musicaAtual.beatmap.length) {
                let proximaNota = musicaAtual.beatmap[notaAtualIndex];
                if (tempoAudio >= proximaNota.time) {
                    spawnNote(proximaNota.dir);
                    notaAtualIndex++;
                }
            }
            requestAnimationFrame(maestroLoop);
        }

        function spawnNote(direcao) {
            const noteEl = document.createElement("div");
            noteEl.classList.add("note");
            noteEl.innerText = emojis[direcao];
            noteEl.style.left = columns[direcao] + "px";
            noteEl.style.top = "-80px"; // Nasce fora da tela em cima
            gameBoard.appendChild(noteEl);

            activeNotes.push({ el: noteEl, direction: direcao, y: -80 });
        }

        function gameLoop() {
            if (!jogoRodando) return;
            const boardHeight = gameBoard.clientHeight;
            const speed = musicaAtual.velocidadeSeta;

            for (let i = activeNotes.length - 1; i >= 0; i--) {
                let note = activeNotes[i];
                note.y += speed;
                note.el.style.top = note.y + "px";

                // Passou do limite inferior (Erro por omissão)
                if (note.y > boardHeight - 20) {
                    gameBoard.removeChild(note.el);
                    activeNotes.splice(i, 1);
                    combo = 0; // Quebra o combo
                    mostrarFeedback("MISS!", "#ff0055");
                    atualizarHUD();
                }
            }
            requestAnimationFrame(gameLoop);
        }

        function avaliarAcerto(direcaoInput) {
            const boardHeight = gameBoard.clientHeight;
            const zonaIdeal = boardHeight - 130; // Ajustado para o design novo
            const lagRede = 35;
            const tolerancia = 50;

            const limiteSuperior = (zonaIdeal + lagRede) - tolerancia;
            const limiteInferior = (zonaIdeal + lagRede) + tolerancia;

            let notaIndex = activeNotes.findIndex(note => note.direction === direcaoInput);

            if (notaIndex !== -1) {
                let note = activeNotes[notaIndex];

                if (note.y > limiteSuperior && note.y < limiteInferior) {
                    // Acerto
                    combo++;
                    score += 100 * (1 + (combo * 0.1)); // Multiplicador de combo
                    mostrarFeedback("PERFECT!", "#00ffcc");

                    gameBoard.removeChild(note.el);
                    activeNotes.splice(notaIndex, 1);
                } else {
                    // Erro por pisar cedo/tarde demais
                    combo = 0;
                    mostrarFeedback("BAD!", "#ffaa00");
                }
                atualizarHUD();
            }
        }

        function ativarHitbox(direcao) {
            const pad = document.getElementById("pad-" + direcao);
            if (pad) {
                pad.classList.add("active");
                setTimeout(() => pad.classList.remove("active"), 120);
            }
        }

        function mostrarFeedback(msg, cor) {
            const fb = document.getElementById("feedback");
            fb.innerText = msg;
            fb.style.color = cor;
            fb.style.textShadow = `0 0 15px ${cor}`;

            // Reinicia a animação rápida
            fb.style.transform = "scale(1.5)";
            setTimeout(() => {
                fb.style.transform = "scale(1)";
            }, 50);

            clearTimeout(fb.timer);
            fb.timer = setTimeout(() => fb.innerText = "", 800);
        }

        function atualizarHUD() {
            document.getElementById("score").innerText = Math.floor(score);
            document.getElementById("combo-display").innerText = combo > 2 ? `Combo: ${combo}x` : "";
        }
    </script>
</body>

</html>
